[project]
name = "agentic-coding-scaffolding"
version = "0.1.0"
description = "A self-evolving scaffolding project for autonomous agentic coding loops powered by Kilo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kilo-autonomous", email = "kilo-autonomous@users.noreply.github.com" }]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = false
exclude = [
    "build",
    "dist",
]

[tool.setuptools]
py_modules = [
    "hello",
    "calculator",
    "collections_utils",
    "config_utils",
    "shapes",
    "strings",
    "utils",
    "stats",
    "math_utils",
    "bit_utils",
    "data_utils",
    "datetime_utils",
    "file_utils",
    "url_utils",
    "random_utils",
    "validation_utils",
    "crypto_utils",
    "list_utils",
    "env_utils",
    "logging_utils",
    "cache_utils",
    "cli_utils",
    "color_utils",
    "timing_utils",
    "async_utils",
    "concurrent_utils",
    "priority_queue_utils",
    "rate_limiter_utils",
    "dict_utils",
    "json_utils",
    "csv_utils",
    "set_utils",
    "statistics_utils",
    "string_utils",
"type_utils",
    "retry_utils",
    "tree_utils",
    "path_utils",
    "pattern_utils",
    "functools_utils",
    "config_schema",
    "exceptions_utils",
    "io_utils",
    "compression_utils",
    "ip_utils",
    "regex_utils",
    "terminal_utils",
]
