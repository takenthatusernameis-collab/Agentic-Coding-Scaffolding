repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
      - id: ruff-format
      - id: check-toml

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: typecheck
        name: mypy
        entry: mypy . --exclude build --exclude dist
        language: system
        types: [python]
      - id: tests
        name: pytest
        entry: python -m unittest discover tests/
        language: system
        types: [python]
        pass_filenames: false
      - id: scaffold-test
        name: scaffold.sh smoke test
        entry: bash -c './scaffold.sh "__pre-commit-smoke__" /tmp/scaffold-pre-commit-smoke --no-test && rm -rf /tmp/scaffold-pre-commit-smoke'
        language: system
        pass_filenames: false
        always_run: true
